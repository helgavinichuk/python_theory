        }

            font-family: inherit;
            text-align: center;
            outline: none;
            cursor: text;
            -moz-appearance: textfield;
        }

        }

            -webkit-appearance: none;
            margin: 0;
        }

            height: 100%;
            overflow: hidden;
            padding: 3rem 4rem;
            background: linear-gradient(135deg, #eaf6ff, #cfe8ff, #e3f2fd);
            scrollbar-width: thin;
            scrollbar-color: #7cb8e8 #dbeaf8;
        }

        .slide::-webkit-scrollbar {
            width: 8px;
        }

        .slide::-webkit-scrollbar-track {
            background: #dbeaf8;
        }

        .slide::-webkit-scrollbar-thumb {
            background: #7cb8e8;
            border-radius: 10px;
        }

        .slide-content {
            max-width: 1200px;
            max-height: 100%;
            overflow-y: auto;

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);

            padding: 2.5rem;

        }

            width: 8px;
        }

            background: #dbeaf8;
            border-radius: 10px;
        }

            background: #7cb8e8;
            border-radius: 10px;
        }
        h1 {

            color: transparent;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 2.2rem;
            color: #0d47a1;
            border-left: 6px solid #2196f3;

            text-align: center;

        }

            bottom: 25px;
            right: 25px;

        }

            color: white;

            font-weight: bold;
            padding: 12px 24px;
            border-radius: 60px;

            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(23, 78, 133, 0.25);
        }

        .nav-btn:hover {
            background: #1976d2;
            transform: scale(1.02);

            bottom: 25px;
            left: 25px;

            bottom: 25px;
            left: 50%;

            border: none;
            color: white;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 100;
            font-weight: bold;

            transition: 0.2s;
        }

            background: #e53935;

            border: 1px solid rgba(33, 150, 243, 0.25);
            border-radius: 20px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #0b5394;
            box-shadow: 0 4px 12px rgba(23, 78, 133, 0.08);

            border-left: 4px solid #00b368;
            border-radius: 16px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #05603f;
            margin: 1rem 0;

            border-radius: 16px;

            .slide-content { padding: 1.5rem; }
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.5rem; }
            p, li { font-size: 1rem; }
            pre, .code-block { font-size: 0.8rem; }
            .global-unlock { font-size: 0.7rem; padding: 6px 12px; bottom: 85px; }
        }
    </style>
</head>

                    <h3>Какие исключения можно указывать в <code>except</code>?</h3>
                    <p>В <code>except</code> можно перечислить <strong>любой класс исключения</strong> (или несколько классов в кортеже). Python перехватит ошибку, если она является экземпляром указанного класса или его наследником.</p>

                    <p><strong>Основные варианты:</strong></p>
                    <ul>
                        <li>★ <code>except Exception:</code> — перехватывает почти все стандартные ошибки (базовый класс для большинства исключений).</li>
                        <li>★ <code>except ValueError:</code> — неверное значение (например, <code>int("abc")</code>).</li>
                        <li>★ <code>except TypeError:</code> — неподходящий тип (например, <code>"2" + 2</code>).</li>
                        <li>★ <code>except ZeroDivisionError:</code> — деление на ноль.</li>
                        <li>★ <code>except IndexError:</code> — выход за границы списка/строки.</li>
                        <li>★ <code>except KeyError:</code> — отсутствующий ключ в словаре.</li>
                        <li>★ <code>except FileNotFoundError:</code> — файл не найден.</li>
                        <li>★ <code>except (ValueError, TypeError):</code> — несколько исключений сразу (кортеж).</li>
                        <li>★ <code>except:</code> — «голый» except перехватывает <strong>всё</strong>, включая системные исключения (используют редко, только когда действительно нужно поймать любую ошибку).</li>

    const slidesContainer = document.getElementById('slidesContainer');

    function renderSlides() {
        slidesData.forEach((slide, index) => {
            const slideDiv = document.createElement('div');
            slideDiv.className = 'slide';
            if (slide.type === 'title') {
                slideDiv.classList.add('title-slide');
                slideDiv.innerHTML = `
                    <div class="slide-content">
                        <h1>${slide.title}</h1>
                        <div class="sub">${slide.subtitle || ''}</div>
                        <div style="margin-top: 3rem; text-align: center;">
                            ${(slide.badges || []).map(b => `<span class="badge">${b}</span>`).join('')}
                        </div>
                        <p style="margin-top: 3rem; text-align: center;">← → или кнопки для навигации</p>
                    </div>
                `;
            } else if (slide.type === 'content') {
                slideDiv.innerHTML = `
                    <div class="slide-content">
                        <h2>${slide.title}</h2>
                        ${slide.content || ''}
                    </div>
                `;
            } else if (slide.type === 'task') {
                const answerId = `answer${index}`;
                slideDiv.innerHTML = `
                    <div class="slide-content">
                        <h2>${slide.title}</h2>
                        <div class="task-card">
                            <h3>${slide.title}</h3>
                            <p>${slide.task}</p>
                            <div class="answer-container">
                                <div class="answer-label">
                                    <span>🔐 Ответ (решение):</span>
                                    <button class="unlock-btn" data-answer-id="${answerId}">Показать ответ</button>
                                </div>
                                <div id="${answerId}" class="answer-content">
                                    <pre>${slide.answer || 'Ответ не указан.'}</pre>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            slidesContainer.appendChild(slideDiv);
        });

    // ==================== НОРМАЛИЗАЦИЯ БЛОКОВ КОДА ====================
    // Убирает отступ у первой строки кода (который появляется из-за
    // форматирования HTML внутри шаблонных строк).
    function normalizeCodeBlocks(root) {
        root.querySelectorAll('.code-block, pre, .info-tree').forEach(el => {
            const lines = el.textContent.split('\n');

            // удаляем пустые строки в начале и в конце
            while (lines.length && lines[0].trim() === '') lines.shift();
            while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();

            // первая строка кода — без ведущих пробелов
            if (lines.length) {
                lines[0] = lines[0].replace(/^\s+/, '');
            }

            el.textContent = lines.join('\n');
        });
    }

    const totalSlides = slidesData.length;
    const STORAGE_KEY = 'presentationSlideIndex';
    let currentIndex = 0;

    const slideInput = document.getElementById('slideInput');
    const totalSlidesSpan = document.getElementById('totalSlidesSpan');

    // Сохраняет текущий слайд в localStorage
    function saveSlideIndex() {
        try {
            localStorage.setItem(STORAGE_KEY, String(currentIndex));
        } catch (e) {
            /* localStorage может быть недоступен (например, file://) */
        }
    }

    function updateSlide() {
        slidesContainer.style.transform = `translateX(${-currentIndex * 100}%)`;
        slideInput.value = currentIndex + 1;
        saveSlideIndex();
    }

    // ---- Кнопки и стрелки ----
    function nextSlide() {
        if (currentIndex < totalSlides - 1) {
            currentIndex++;
            updateSlide();
        }
    }

    function prevSlide() {
        if (currentIndex > 0) {
            currentIndex--;
            updateSlide();
        }
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    window.addEventListener('keydown', (e) => {
        // Не перехватываем стрелки, пока пользователь вводит номер слайда
        if (document.activeElement === slideInput) return;
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
    });

    // ---- Ручной ввод номера ----
    function goToSlide(n) {
        n = parseInt(n, 10);
        if (isNaN(n)) {                              // пустое/некорректное — откат
            slideInput.value = currentIndex + 1;
            return;
        }
        n = Math.min(Math.max(n, 1), totalSlides);   // зажимаем в 1..totalSlides
        currentIndex = n - 1;
        updateSlide();
    }

    slideInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            goToSlide(slideInput.value);
            slideInput.blur();
        } else if (e.key === 'Escape') {
            slideInput.value = currentIndex + 1;
            slideInput.blur();
        }
    });

    slideInput.addEventListener('blur', () => {
        goToSlide(slideInput.value);
    });

    slideInput.addEventListener('focus', () => {
        slideInput.select();
    });



    
    // ==================== ПОКАЗ ОТВЕТОВ ====================
    function showAnswerWithPassword(answerElementId) {
        const password = prompt("Введите пароль для просмотра ответа:");
        if (password === "123") {
            const answerDiv = document.getElementById(answerElementId);
            if (answerDiv) {
                answerDiv.classList.add("visible");
                const btn = document.querySelector(`.unlock-btn[data-answer-id="${answerElementId}"]`);
                if (btn) {
                    btn.textContent = "✓ Ответ открыт";
                    btn.disabled = true;
                    btn.style.opacity = "0.6";
                    btn.style.cursor = "default";
                }
            }
        } else {
            alert("Неверный пароль! Ответ не показан.");
        }
    }

    // Глобальная кнопка — показать все ответы
    const globalUnlockBtn = document.getElementById('globalUnlockBtn');
    globalUnlockBtn.addEventListener('click', () => {
        const password = prompt("Введите мастер-пароль для показа ВСЕХ ответов:");
        if (password === "123") {
            const allAnswerDivs = document.querySelectorAll('.answer-content');
            let openedCount = 0;
            allAnswerDivs.forEach(div => {
                if (!div.classList.contains('visible')) {
                    div.classList.add('visible');
                    openedCount++;
                }
            });
            const allBtns = document.querySelectorAll('.unlock-btn');
            allBtns.forEach(btn => {
                btn.textContent = "✓ Ответ открыт";
                btn.disabled = true;
                btn.style.opacity = "0.6";
                btn.style.cursor = "default";
            });
            alert(`Открыто ${openedCount} ответов!`);
        } else {
            alert("Неверный пароль! Ответы не показаны.");
        }
    });

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    renderSlides();
    normalizeCodeBlocks(slidesContainer);

    // Показываем общее количество слайдов
    totalSlidesSpan.textContent = totalSlides;

    // Восстанавливаем последний открытый слайд
    let savedIndex = NaN;
    try {
        savedIndex = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    } catch (e) { /* localStorage недоступен — начинаем с 1 */ }

    if (Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < totalSlides) {
        currentIndex = savedIndex;
    }

    updateSlide();

    // Делегирование событий для кнопок ответов
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('unlock-btn')) {
            const answerId = e.target.getAttribute('data-answer-id');
            if (answerId) {
                const answerDiv = document.getElementById(answerId);
                if (answerDiv && answerDiv.classList.contains('visible')) {
                    alert("Ответ уже открыт!");
                    return;
                }
                showAnswerWithPassword(answerId);
            }
        }
    });
</script>
</body>
</html>
